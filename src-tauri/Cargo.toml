[package]
name = "flycut-caption"
version = "1.1.0"
description = "FlyCut Caption desktop client"
authors = ["FlyCut Team"]
edition = "2021"

[lib]
name = "flycut_caption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
