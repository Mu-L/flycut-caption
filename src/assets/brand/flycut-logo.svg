<svg xmlns="http://www.w3.org/2000/svg" width="360" height="80" viewBox="0 0 360 80" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">FlyCut Caption logo</title>
  <desc id="desc">FlyCut Caption wordmark with a caption-track mark.</desc>
  <defs>
    <linearGradient id="flycut-coral" x1="52" y1="8" x2="40" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F56C6C"/>
      <stop offset=".56" stop-color="#FF8078"/>
      <stop offset="1" stop-color="#D94A4D"/>
    </linearGradient>
    <filter id="flycut-glow" x="18" y="0" width="54" height="80" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-color="#F56C6C" flood-opacity=".32"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="3.5"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <g aria-hidden="true">
    <path fill="#E5EAF3" d="M10 19h31c3.314 0 6 2.686 6 6v7H16a6 6 0 0 1-6-6v-7Z"/>
    <path fill="#E5EAF3" d="M50 19h28v7a6 6 0 0 1-6 6H50V19Z"/>
    <path fill="#5A5D62" fill-opacity=".72" d="M10 44h34v13H16a6 6 0 0 1-6-6v-7Z"/>
    <path fill="#5A5D62" fill-opacity=".72" d="M48 44h30v7a6 6 0 0 1-6 6H48V44Z"/>
    <path stroke="#0A0A0A" stroke-linecap="round" stroke-width="7" d="M56 12 32 64"/>
    <path filter="url(#flycut-glow)" fill="url(#flycut-coral)" d="M53.986 9.5h4.812L34.014 66.5h-4.812L53.986 9.5Z"/>
    <path stroke="#FFFFFF" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.1" d="M54.5 14.5 31.5 61.5"/>
  </g>
  <text x="98" y="51" fill="#E5EAF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="35" font-weight="720" letter-spacing="0">Fly</text>
  <text x="153" y="51" fill="#F56C6C" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="35" font-weight="760" letter-spacing="0">Cut</text>
  <text x="216" y="51" fill="#E5EAF3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="35" font-weight="720" letter-spacing="0">Caption</text>
</svg>
