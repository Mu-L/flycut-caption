<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">FlyCut Caption mark</title>
  <desc id="desc">Two caption tracks cut by a coral timeline blade.</desc>
  <defs>
    <linearGradient id="flycut-coral" x1="54" y1="2" x2="42" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F56C6C"/>
      <stop offset=".56" stop-color="#FF8078"/>
      <stop offset="1" stop-color="#D94A4D"/>
    </linearGradient>
    <filter id="flycut-glow" x="20" y="-6" width="56" height="76" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-color="#F56C6C" flood-opacity=".35"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="3.5"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <path fill="#E5EAF3" d="M14 13h31c3.314 0 6 2.686 6 6v7H20a6 6 0 0 1-6-6v-7Z"/>
  <path fill="#E5EAF3" d="M54 13h28v7a6 6 0 0 1-6 6H54V13Z"/>
  <path fill="#5A5D62" fill-opacity=".72" d="M14 38h34v13H20a6 6 0 0 1-6-6v-7Z"/>
  <path fill="#5A5D62" fill-opacity=".72" d="M52 38h30v7a6 6 0 0 1-6 6H52V38Z"/>
  <path stroke="#0A0A0A" stroke-linecap="round" stroke-width="7" d="M60 6 36 58"/>
  <path filter="url(#flycut-glow)" fill="url(#flycut-coral)" d="M57.986 3.5h4.812L38.014 60.5h-4.812L57.986 3.5Z"/>
  <path stroke="#FFFFFF" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.1" d="M58.5 8.5 35.5 55.5"/>
</svg>
