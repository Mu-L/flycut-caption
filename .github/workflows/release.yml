name: release

# 触发条件：推送 v* 标签自动打包发布；或在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false # 单个平台失败不影响其他平台继续构建
      matrix:
        include:
          # macOS arm64（Apple Silicon）
          - os: macos-14
            label: macos-arm64
          # Windows x86_64
          - os: windows-latest
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/sidecars/funasr-asr

      - name: Cache binaries & shared assets
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/shared_assets
          key: assets-${{ matrix.label }}-${{ hashFiles('scripts/fetch-*.sh') }}
          restore-keys: |
            assets-${{ matrix.label }}-

      - name: Build funasr sidecar
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/sidecars/funasr-asr/Cargo.toml
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/sidecars/funasr-asr/target/release/funasr-asr.exe src-tauri/binaries/funasr-asr.exe
          else
            cp src-tauri/sidecars/funasr-asr/target/release/funasr-asr src-tauri/binaries/funasr-asr
            chmod +x src-tauri/binaries/funasr-asr
          fi

      - name: Fetch FFmpeg
        shell: bash
        run: pnpm fetch:ffmpeg

      - name: Fetch shared assets (VAD models)
        shell: bash
        run: pnpm fetch:shared-assets

      - name: Fetch subtitle fonts
        shell: bash
        run: pnpm fetch:subtitle-fonts

      - name: Build Tauri app
        shell: bash
        run: pnpm exec tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flycut-caption-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    # 仅在 tag 触发时发布到 npm；手动触发跳过
    # 与桌面端 build/release 解耦：npm 失败不应阻塞 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check NPM_TOKEN
        # setup-node 的 registry-url 会写 .npmrc 读取 NODE_AUTH_TOKEN；
        # 未配置 secrets.NPM_TOKEN 时 npm publish 会报 ENEEDAUTH
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::仓库 Secrets 未配置 NPM_TOKEN，无法发布到 npm。"
            echo "请到 Settings → Secrets and variables → Actions 添加 NPM_TOKEN"
            echo "（npm Automation / Granular Access Token，需有 @flycut 作用域发布权限）"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # prepublishOnly 钩子会自动跑 lint + build:lib 生成 dist/
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Publish Release
    # 只依赖桌面端构建；npm 发布失败不影响创建 GitHub Release
    needs: [build]
    # 仅在 tag 触发时发布到 Release；手动触发只产出 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          generate_release_notes: true
