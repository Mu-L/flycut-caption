<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">FlyCut Caption app icon</title>
  <desc id="desc">A dark app icon with caption tracks cut by a coral timeline blade.</desc>
  <defs>
    <linearGradient id="bg" x1="180" y1="92" x2="880" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D1D1D"/>
      <stop offset=".58" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="130" y1="96" x2="900" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C2E34"/>
      <stop offset=".52" stop-color="#5F33E1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#F56C6C" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="slash" x1="626" y1="186" x2="398" y2="838" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F56C6C"/>
      <stop offset=".55" stop-color="#FF8078"/>
      <stop offset="1" stop-color="#D94A4D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(300 330 -330 300 532 492)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F56C6C" stop-opacity=".34"/>
      <stop offset=".44" stop-color="#5F33E1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="slashGlow" x="272" y="128" width="476" height="768" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feFlood flood-color="#F56C6C" flood-opacity=".42"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="24"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="35" y="35" width="954" height="954" rx="203" stroke="url(#stroke)" stroke-opacity=".88" stroke-width="18"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <g transform="translate(112 190) scale(8.33333)">
    <path fill="#E5EAF3" d="M14 13h31c3.314 0 6 2.686 6 6v7H20a6 6 0 0 1-6-6v-7Z"/>
    <path fill="#E5EAF3" d="M54 13h28v7a6 6 0 0 1-6 6H54V13Z"/>
    <path fill="#5A5D62" fill-opacity=".72" d="M14 38h34v13H20a6 6 0 0 1-6-6v-7Z"/>
    <path fill="#5A5D62" fill-opacity=".72" d="M52 38h30v7a6 6 0 0 1-6 6H52V38Z"/>
    <path stroke="#0A0A0A" stroke-linecap="round" stroke-width="7" d="M60 6 36 58"/>
    <path filter="url(#slashGlow)" fill="url(#slash)" d="M57.986 3.5h4.812L38.014 60.5h-4.812L57.986 3.5Z"/>
    <path stroke="#FFFFFF" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.1" d="M58.5 8.5 35.5 55.5"/>
  </g>
</svg>
